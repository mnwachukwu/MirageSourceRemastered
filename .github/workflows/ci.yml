# What a change to the engine is held to, and how a version becomes downloadable.
#
# **One Windows runner, for all three platforms.** That is not a limitation — it is what the publish
# system is built for. `vpk` packs Windows natively, cross-compiles Linux through its `[linux]`
# directive, and macOS is hand-rolled into a .app.tar.gz because it cannot be cross-built by vpk at
# all. Windows is also the platform where the MonoGame content pipeline and the Avalonia editor are
# known to build without extra setup. A matrix across three runners would buy nothing and would need
# the artifacts stitched back together afterwards.
#
# Checked on everything, shipped on a tag. A push or a pull request builds and runs every test and
# stops there; a tag of the form v1.0.0 does all of that and then publishes and cuts a GitHub
# Release. workflow_dispatch does everything except create the release, which makes it a rehearsal —
# it still publishes and uploads the installers as a run artifact, so you can download exactly what
# a release would have contained and look at it first.
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
# The release this creates is what https://mirage.pluperfect.dev reads to fill in its download
# table. It resolves assets by name — `-Server-` and `-Editor-` identify those two and anything else
# is the client — which is exactly what the packaging below emits, so the two stay in step without
# either knowing about the other.

name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the release job asks for more where it needs it.
permissions:
  contents: read

jobs:
  # ---- Do the docs still point at things that exist? -------------------------------------------
  #
  # Its own job rather than a step on one of the others: it needs no toolchain setup at all, so it
  # finishes in seconds and says on its own row whether the prose is intact rather than hiding
  # inside a compile log. Folding it into the ubuntu leg of `test` would also have been free — that
  # job already sets up .NET — but then a broken documentation link reports as
  # "Tests (ubuntu-latest) failed", which is exactly the ambiguous status the matrix exists to
  # avoid.
  #
  # Documentation rot is invisible to everything else here. A renamed file or a reorganized
  # document breaks links that nothing compiles and no test covers, and the person who moved the
  # file is the least likely to notice. This is the only check in the repository that reads prose.
  #
  # Runs on ubuntu deliberately. The checker compares path spelling against real directory entries
  # precisely because a Windows or macOS filesystem answers case-insensitively and would let
  # `Docs/Building.md` pass locally while 404ing here and on github.com — but running it on the
  # case-sensitive platform too means the OS itself is a second opinion.
  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # No setup step of any kind. Every GitHub-hosted runner ships Node, and the checker imports
      # nothing outside Node's standard library — no package.json, no install, nothing to keep up
      # to date. This was briefly a .NET file-based program, which read better beside the rest of
      # the codebase but needed setup-dotnet: .NET 10 is not preinstalled, and file-based programs
      # are a .NET 10 feature, so the SDK an image happens to carry cannot be assumed. Thirty
      # seconds of setup to check sixty lines' worth of links was the wrong trade.
      - name: Check every link in the Markdown resolves
        run: node .github/checks/check-doc-links.mjs

      # Numbers rot the same way links do, and the README's seed counts have gone stale twice. The
      # site is written FROM this README by its own stated rule, so a wrong count publishes twice.
      - name: Check the README's seed counts match data/
        run: node .github/checks/check-seed-counts.mjs

  # ---- Does it work off Windows? ---------------------------------------------------------------
  #
  # The build job below compiles for all three platforms from one Windows runner, which proves they
  # *compile* and nothing more. It never runs a line of code on Linux or macOS.
  #
  # That matters because some of this code only exists on those platforms. `UserPaths` branches three
  # ways on the operating system — Windows known folders, macOS ~/Library, the Linux XDG spec — and
  # `RuntimeInformation.IsOSPlatform` is not something a test can lie about, so on any single machine
  # two of those branches are unreachable. Linux is also case-sensitive, which nothing on a Windows
  # runner can ever surface: every path the persistence and localization loaders build is a place
  # that difference could bite.
  #
  # Three of the four suites run here. The fourth, Mirage.Client.Shell.Tests, is left to the Windows
  # job: it is the only project that pulls in MonoGame, and building its content — five spritefonts
  # and a shader — needs native tooling off Windows that is not worth fighting for tests that are not
  # platform-sensitive anyway.
  #
  # Windows is in the matrix as well, even though the build job re-runs these. A minute of duplicated
  # work buys a row per platform that either is or is not green, rather than one row that is green
  # and two that a reader has to reason about.
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not hide the others — knowing it is *only* macOS is most of the
      # diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Named individually rather than through Mirage.Test.csproj, which drives all four and would
      # drag the MonoGame client in. No tool manifests are restored: none of these three need mgcb,
      # and nothing here publishes, so vpk is not wanted either.
      - name: Test — server and shared
        run: dotnet test tests/Mirage.Server.Tests/Mirage.Server.Tests.csproj -c Release --nologo

      - name: Test — client core
        run: dotnet test tests/Mirage.Client.Core.Tests/Mirage.Client.Core.Tests.csproj -c Release --nologo

      - name: Test — editor
        run: dotnet test tests/Mirage.Editor.Tests/Mirage.Editor.Tests.csproj -c Release --nologo

  # ---- Everything, and the shipping artifacts --------------------------------------------------

  build:
    name: Build, test and publish
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # global.json pins 10.0.302 with rollForward: latestFeature, so this installs what the repo
      # asks for rather than whatever the image happens to ship.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', '**/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Two manifests, and the second is not redundant. The root one declares vpk (which does the
      # packaging below) and ilspycmd; client/.config declares mgcb, the MonoGame content builder.
      # The client manifest sets "isRoot": true, which stops the upward search — so a restore at the
      # root never reaches it, and a build without it produces a client with no compiled content.
      - name: Restore tools
        run: |
          dotnet tool restore
          dotnet tool restore --tool-manifest client/.config/dotnet-tools.json

      - name: Restore
        run: dotnet restore Mirage.slnx

      # The tag names the version people will download; Directory.Build.props names the version
      # stamped into the executables and the installers — it feeds AssemblyVersion, FileVersion,
      # InformationalVersion and vpk's --packVersion alike. If those disagree, someone downloads
      # "v1.2.0" and installs something that calls itself 1.0.0, which is the kind of thing nobody
      # notices until a bug report cites a version that was never built.
      #
      # Placed straight after restore rather than after the build: evaluating the project needs the
      # NoTargets SDK that restore just fetched, and failing here costs seconds instead of the full
      # build-and-test pass.
      - name: Check the tag matches the version in the tree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          declared=$(dotnet msbuild Mirage.Publish.csproj -getProperty:Version -v:q | tr -d '[:space:]')
          tagged="${GITHUB_REF_NAME#v}"
          echo "Directory.Build.props says $declared, the tag says $tagged"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Version $declared. Bump MajorVersion/MinorVersion/PatchVersion in Directory.Build.props, or move the tag."
            exit 1
          fi

      # This runs the tests as well as compiling. Mirage.Test.csproj is a solution member whose Build
      # target is TestAll, so a solution build drives all four suites and fails if any of them does —
      # the four exit codes have to concatenate to "0000". That is the repository's own convention;
      # asking for the tests separately here would just run them twice.
      - name: Build and test
        run: dotnet build Mirage.slnx -c Release --no-restore --nologo

      # Nine publish passes plus packaging — slow, so it is reached only when something is actually
      # being shipped or deliberately rehearsed. Packaging is behind an explicit target on purpose:
      # every publish project is a solution member, and defaulting them to PublishAll once turned a
      # 9-second solution build into a 127-second one that wrote the same dist/ paths from two
      # directions at once.
      - name: Publish and package all platforms
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: dotnet msbuild Mirage.Publish.csproj /t:PublishAll -v:minimal

      - name: Show what was produced
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          find dist/installers -type f | sort
          echo
          du -sh dist/installers/* || true

      # Handed to the release job rather than rebuilt there. Building again would mean publishing a
      # set of installers that no test ever ran against.
      - name: Keep the installers
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: installers
          path: dist/installers
          retention-days: 7
          if-no-files-found: error

  # ---- Shipping it -----------------------------------------------------------------------------

  release:
    name: Release
    # All three, not just build. A green Windows build says nothing about whether the thing runs on
    # the other two platforms it is about to be published for; and a release is exactly the moment
    # people arrive at the documentation for the first time, so shipping one with links that go
    # nowhere is the worst time to find out. Docs takes seconds and gates nothing in practice.
    needs: [docs, test, build]
    runs-on: ubuntu-latest

    # A tag and nothing else. The rehearsal button publishes and keeps the artifact, but never
    # creates a release — so the only way something becomes downloadable is somebody naming a
    # version and pushing it.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    # Two runs creating the same release would race. Not cancel-in-progress: a half-uploaded release
    # is worse than a slow one.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Take the installers that were built and tested
        uses: actions/download-artifact@v8
        with:
          name: installers
          path: installers

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t assets < <(find installers -type f | sort)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No installers in the artifact; refusing to cut an empty release."
            exit 1
          fi

          printf 'attaching %s\n' "${assets[@]}"

          # Moving a tag is the documented way to redeploy a version after a rollback, so a release
          # for this tag may already exist. Replacing its assets is the right answer there; failing
          # would leave the tag pointing at a release nobody refreshed.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists — replacing its assets"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "${assets[@]}"
          fi

      # The site reads releases/latest and matches assets by name. If that ever returns something
      # this run did not produce, the download page is describing a release that does not exist.
      - name: Check the release is what the site will read
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "--- what /releases/latest now resolves to ---"
          gh release view --json tagName,assets --jq '.tagName, (.assets[].name)'
